[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dignn"
version = "1.0.0"
description = "Probabilistic heatwave forecasting in Burkina Faso with an EVT-informed graph neural network"
authors = [{ name = "Sidikèta Idrissa SAVADOGO" }]
license = { text = "MIT" }
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]
